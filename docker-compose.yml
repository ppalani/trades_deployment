version: "3.8"

services:
  db:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE}   # this will point to .env created from secrets
    volumes:
      - ${POSTGRES_VOLUME_NAME}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: trades_java_app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE}
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ${POSTGRES_VOLUME_NAME}:
    driver: local
