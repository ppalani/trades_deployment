name: Deploy Trades Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev or sit)"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the deployment repository
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      # 2️⃣ Log in to GHCR (if token exists)
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "GHCR_TOKEN not set, skipping login (assuming public package)"
          fi

      # 3️⃣ Set up SSH agent
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 4️⃣ Create .env file locally and store in a variable
      - name: Create .env file
        id: envfile
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "${{ secrets.ENV_DEV }}" > .env
          else
            echo "${{ secrets.ENV_SIT }}" > .env
          fi
          # Store content as a GitHub Actions output to pass to next step
          ENV_CONTENT=$(cat .env)
          echo "env_content<<EOF" >> $GITHUB_OUTPUT
          echo "$ENV_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Deploy to Raspberry Pi
      - name: Deploy to Raspberry Pi
        run: |
          SERVER_USER=$(grep SERVER_USER .env | cut -d'=' -f2)
          SERVER_IP=$(grep SERVER_IP .env | cut -d'=' -f2)
          SERVER_PORT=$(grep SERVER_PORT .env | cut -d'=' -f2)
          DEPLOY_DIR="/home/${SERVER_USER}/trades_deployment"

          echo "Deploying to $SERVER_USER@$SERVER_IP on port $SERVER_PORT..."

          # Send the .env and deploy stack via SSH heredoc
          ssh -o StrictHostKeyChecking=no -p $SERVER_PORT ${SERVER_USER}@${SERVER_IP} bash << 'EOF_REMOTE'
mkdir -p "${DEPLOY_DIR}"
cat > "${DEPLOY_DIR}/.env" << 'EOF_ENV'
${{ steps.envfile.outputs.env_content }}
EOF_ENV
cd "${DEPLOY_DIR}"
# Clone repo if not already cloned
if [ ! -d ".git" ]; then
  git clone https://github.com/ppalani/trades_deployment.git .
else
  git pull
fi
docker compose --env-file .env pull
docker compose --env-file .env up -d
EOF_REMOTE
