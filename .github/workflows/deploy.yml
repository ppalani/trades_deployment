name: Deploy Trades Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev or sit)"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the deployment repository
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      # 2️⃣ Log in to GHCR (only if GHCR_TOKEN secret exists)
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "GHCR_TOKEN not set, skipping login (assuming public package)"
          fi

      # 3️⃣ Set up SSH agent with private key
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 4️⃣ Create .env file locally
      - name: Create .env file
        run: |
          echo "Creating .env file for ${{ github.event.inputs.environment }} environment..."
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "${{ secrets.ENV_DEV }}" > .env
          else
            echo "${{ secrets.ENV_SIT }}" > .env
          fi
          echo ".env file created:"
          cat .env

      # 5️⃣ Deploy to Raspberry Pi
      - name: Deploy to Raspberry Pi
        run: |
          SERVER_USER=$(grep SERVER_USER .env | cut -d'=' -f2)
          SERVER_IP=$(grep SERVER_IP .env | cut -d'=' -f2)
          SERVER_PORT=$(grep SERVER_PORT .env | cut -d'=' -f2)
          DEPLOY_DIR="/home/${SERVER_USER}/trades_deployment"
          echo "Deploying to $SERVER_USER@$SERVER_IP on port $SERVER_PORT..."

          # Copy .env to Pi with host key checking disabled
          scp -o StrictHostKeyChecking=no -P $SERVER_PORT .env ${SERVER_USER}@${SERVER_IP}:${DEPLOY_DIR}/.env

          # SSH into Pi and deploy
          ssh -o StrictHostKeyChecking=no -p $SERVER_PORT ${SERVER_USER}@${SERVER_IP} "
            mkdir -p ${DEPLOY_DIR} &&
            cd ${DEPLOY_DIR} &&
            git pull || echo 'Git pull failed, continuing...' &&
            docker compose --env-file .env pull &&
            docker compose --env-file .env up -d
          "
